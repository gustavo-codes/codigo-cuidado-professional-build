# Template: o entrypoint da imagem nginx:alpine troca ${PORT} e gera /etc/nginx/conf.d/site.conf
# (dentro do http{} da imagem base). Serve o dist/ do scripts/montar-site.mjs como está:
# os .unityweb vão sem Content-Encoding (o loader da Unity descomprime).
server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache" always;

    location ~ \.unityweb$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /ServiceWorker.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
