# Este arquivo e um TEMPLATE: o entrypoint da imagem nginx:alpine roda envsubst
# (so em PORT e COMPRESSAO) e gera /etc/nginx/conf.d/nginx.conf, que fica DENTRO
# do http{} do nginx.conf da imagem base. Por isso aqui so ha map e server.
# Mesmo arquivo nos 3 builds. Explicacao de COMPRESSAO no Dockerfile.

# Modo br + navegador aceita br -> serve o .br original de /_br com Content-Encoding: br.
# Qualquer outro caso -> versao descomprimida (mesmo nome), sem Content-Encoding.
map "${COMPRESSAO}|$http_accept_encoding" $unity_dir {
    default "";
    "~*^br\|.*\bbr\b" "/_br";
}
map $unity_dir $unity_ce {
    default "";
    "/_br" "br";
}

server {
        listen ${PORT};
        root /usr/share/nginx/html;
        index index.html;

        # Revalida a cada uso: sem isso o Cloudflare aplica max-age=14400 (4h)
        # e serve build antigo depois de cada deploy.
        add_header Cache-Control "no-cache" always;

        # Arquivos .br da Unity: um location por arquivo, gerado no build com o
        # tipo, o X-Expected-Length (tamanho real, para a barra de carregamento)
        # e a escolha entre .br original e descomprimido. Tipos literais de
        # proposito: variavel no default_type chegava como texto pelo proxy do Coolify.
        # Cache imutavel de 1 ano: a versao do build vem na URL (?v=).
        include /etc/nginx/arquivos-unity.inc;

        # Outros arquivos do build (loader.js): imutavel pela mesma razao.
        location ~ ^/Build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Copias internas dos .br originais: so acessiveis pelos locations acima.
        location ^~ /_br/ {
            internal;
        }

        # O navegador cacheia o script do SW pelo Cache-Control da resposta;
        # com max-age longo o Safari demora horas para perceber um SW novo.
        location = /ServiceWorker.js {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
