<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seleção de Fases - LGPD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="acessibilidade.css">

    <style>
        /* ================= HUB "PLANTÃO" (Fase C do GUIA_UI_PLANTAO.md) ================= */
        :root { --fonte-texto: 'Roboto', sans-serif; }

        body {
            margin: 0; font-family: var(--cc-font-body, 'Roboto', sans-serif); color: var(--cc-ink, #004357);
            background-color: var(--cc-bg, #F4FBFD);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-y: auto; overflow-x: hidden;
            padding: 0 16px 150px; box-sizing: border-box;
        }

        .bg-imagem-real {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            object-fit: cover; object-position: center; transform: scale(1.08);
            filter: blur(8px) saturate(.75); opacity: .4; pointer-events: none;
        }

        /* ---------- Vitória do perfil (classes do JS mantidas) ---------- */
        body.vitoria-verde .bg-imagem-real { filter: blur(8px) sepia(.3) hue-rotate(80deg); opacity: .5; }
        body.vitoria-ouro .bg-imagem-real { filter: blur(8px) sepia(.5) hue-rotate(10deg) saturate(1.5); opacity: .5; }
        body.vitoria-ouro::after {
            content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
            box-shadow: inset 0 0 0 6px var(--cc-gold), inset 0 0 90px rgba(255, 200, 61, .35);
            animation: cc-aura 2s infinite ease-in-out;
        }
        @keyframes cc-aura { 50% { box-shadow: inset 0 0 0 6px var(--cc-gold), inset 0 0 140px rgba(255, 200, 61, .5); } }

        /* ---------- Header (barra-painel) ---------- */
        header {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px; margin-top: 24px; box-sizing: border-box;
            display: flex; align-items: center; gap: 16px;
        }
        .hub-barra {
            flex: 1; min-width: 0; min-height: 68px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
            padding: 8px 12px 8px 20px;
            background: #fff; border: 3px solid var(--cc-ink); border-radius: 20px; box-shadow: 0 5px 0 var(--cc-ink);
        }
        .perfil-wrapper { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
        .perfil-label { font-family: var(--cc-font-hud); font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cc-action); }
        .perfil-tipo-container { display: flex; align-items: center; gap: 10px; }
        .perfil-tipo { font-family: var(--cc-font-title); font-size: 26px; font-weight: 700; color: var(--cc-ink); line-height: 1.1; }
        .btn-trocar-perfil {
            min-height: 44px; padding: 0 14px; cursor: pointer;
            font-family: var(--cc-font-title); font-weight: 600; font-size: 15px; color: var(--cc-ink);
            background: var(--cc-sky); border: 3px solid var(--cc-ink); border-radius: 12px; box-shadow: 0 3px 0 var(--cc-ink);
            transition: transform .08s, box-shadow .08s;
        }
        .btn-trocar-perfil:hover { background: var(--cc-mint); }
        .btn-trocar-perfil:active { transform: translateY(3px); box-shadow: 0 0 0 var(--cc-ink); }

        .hub-metas { display: flex; align-items: center; gap: 14px; }
        .hub-progresso { display: flex; align-items: center; gap: 8px; width: 210px; }
        .hub-progresso .cc-progress { flex: 1; height: 18px; }
        .hub-num { font-family: var(--cc-font-hud); font-weight: 700; font-size: 17px; white-space: nowrap; }
        .hub-estrelas { display: inline-flex; align-items: center; gap: 6px; background: var(--cc-gold-bg); border: 2px solid var(--cc-ink); border-radius: 999px; padding: 4px 12px 4px 6px; }
        .hub-estrelas svg { width: 24px; height: 24px; }

        .btn-icone {
            width: 56px; height: 56px; flex-shrink: 0; padding: 0; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            background: #fff; color: var(--cc-ink);
            border: 3px solid var(--cc-ink); border-radius: 50%; box-shadow: 0 4px 0 var(--cc-ink);
            transition: transform .08s, box-shadow .08s;
        }
        .btn-icone svg { width: 26px; height: 26px; }
        .btn-icone:hover { background: var(--cc-mint); }
        .btn-icone:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cc-ink); }
        .btn-apagar { color: var(--cc-bad-ink); }
        .btn-apagar:hover { background: var(--cc-bad-bg); }
        button:focus-visible, .level-card:focus-visible { outline: 4px solid var(--cc-upa); outline-offset: 3px; }

        /* Conclusão do perfil */
        header.perfil-concluido .hub-barra { border-color: var(--cc-ok); box-shadow: 0 5px 0 var(--cc-ok); background: var(--cc-ok-bg); }
        header.perfil-concluido .perfil-label { color: var(--cc-ok-ink); }
        header.perfil-mestre .hub-barra { background: var(--cc-gold-bg); box-shadow: 0 5px 0 var(--cc-ink), 0 0 0 6px var(--cc-gold); animation: cc-brilho 2s infinite ease-in-out; }
        header.perfil-mestre .perfil-label { color: var(--cc-ink); }
        @keyframes cc-brilho { 50% { box-shadow: 0 5px 0 var(--cc-ink), 0 0 0 10px rgba(255, 200, 61, .55); } }

        /* ---------- Trilha de fases ---------- */
        .container-fases {
            position: relative; z-index: 10;
            width: 100%; max-width: 1100px; box-sizing: border-box; margin: 40px auto 30px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 34px 22px; align-items: start;
        }
        .level-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .level-wrap:nth-child(even) { padding-top: 36px; }
        /* trilha tracejada ligando os cartões */
        .level-wrap::before {
            content: ""; position: absolute; z-index: -1; top: 120px; left: -22px; width: 22px; height: 10px;
            background: repeating-linear-gradient(90deg, var(--cc-ink) 0 10px, transparent 10px 16px); opacity: .35; border-radius: 999px;
        }
        .level-wrap:nth-child(even)::before { top: 138px; }
        .level-wrap:first-child::before { display: none; }

        .level-card {
            position: relative; width: 100%; height: 230px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            padding: 22px 10px 16px; text-align: center; cursor: pointer;
            background: #fff; border: 3px solid var(--cc-ink); border-radius: 24px; box-shadow: 0 6px 0 var(--cc-ink);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .level-card:hover { transform: translateY(-4px); box-shadow: 0 10px 0 var(--cc-ink); }
        .level-card:active { transform: translateY(6px); box-shadow: 0 0 0 var(--cc-ink); }

        .level-number {
            position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
            font-family: var(--cc-font-hud); font-weight: 700; font-size: 16px; line-height: 1;
            padding: 6px 12px; border-radius: 10px; border: 3px solid var(--cc-ink); background: #fff; color: var(--cc-ink);
        }
        .level-icone {
            width: 64px; height: 64px; border-radius: 18px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--cc-font-title); font-weight: 700; font-size: 34px;
            border: 3px solid var(--cc-ink); background: var(--cc-sky); color: var(--cc-ink);
        }
        .level-icone svg { width: 34px; height: 34px; }
        .level-title {
            font-family: var(--cc-font-title); font-size: 19px; font-weight: 600; color: var(--cc-ink); line-height: 1.15; padding: 0 4px;
            overflow: hidden; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .level-tag { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #E3EAED; color: #4F6970; }

        .estrelas-container { display: flex; gap: 2px; justify-content: center; }
        .estrela { display: inline-flex; }
        .estrela svg { width: 26px; height: 26px; fill: var(--cc-track); stroke: var(--cc-ink); }
        .estrela.ativa svg, .estrela.ativa-clara svg { fill: var(--cc-gold); }
        .estrela.maior svg { width: 52px; height: 52px; }
        .estrela.maior:nth-child(2) svg { width: 66px; height: 66px; }
        #modal-fase-estrelas { align-items: flex-end; }
        #modal-fase-estrelas .estrela:nth-child(2) { margin-bottom: 10px; }

        /* Estados (classes do JS) */
        .level-card.concluida { background: #fff; }
        .level-wrap.concluida .level-tag { background: var(--cc-ok-bg); color: var(--cc-ok-ink); }
        .level-card.destaque-atual { background: var(--cc-paper); transform: translateY(-8px); box-shadow: 0 0 0 6px var(--cc-sky), 0 8px 0 var(--cc-ink); }
        .level-card.destaque-atual:hover { transform: translateY(-12px); box-shadow: 0 0 0 6px var(--cc-sky), 0 12px 0 var(--cc-ink); }
        .level-card.destaque-atual .level-number { background: var(--cc-upa); }
        .level-card.destaque-atual .level-icone { background: var(--cc-action); color: #fff; }
        .level-wrap.destaque-atual .level-tag { background: var(--cc-ink); color: #fff; }
        .level-card.bloqueada { cursor: not-allowed; pointer-events: none; background: var(--cc-off); border-color: var(--cc-off-line); box-shadow: 0 6px 0 var(--cc-off-line); }
        .level-card.bloqueada .level-number { background: var(--cc-off); border-color: var(--cc-off-line); color: var(--cc-off-ink); }
        .level-card.bloqueada .level-icone { background: transparent; border-color: transparent; color: var(--cc-off-ink); }
        .level-card.bloqueada .level-title { color: var(--cc-off-ink); }
        .level-card.bloqueada .estrela svg { fill: #E3EAED; stroke: var(--cc-off-line); }
        .level-card.mestre { background: var(--cc-gold-bg); }
        .level-card.mestre .level-number { background: var(--cc-gold); }

        /* ---------- Painel "Próxima fase" ---------- */
        .hub-proxima {
            position: fixed; z-index: 20; left: 0; right: 0; margin: 0 auto; bottom: 20px;
            width: min(760px, calc(100% - 32px)); box-sizing: border-box;
            display: flex; align-items: center; gap: 20px; padding: 14px 16px 14px 24px;
            background: #fff; border: 3px solid var(--cc-ink); border-radius: 22px; box-shadow: 0 6px 0 var(--cc-ink);
            animation: cc-pop-in .18s var(--cc-ease-pop) both;
        }
        .hub-proxima-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .hub-proxima-nome { font-family: var(--cc-font-title); font-weight: 700; font-size: 23px; line-height: 1.15; }
        .hub-proxima-desc { font-size: 15px; color: var(--cc-muted); line-height: 1.35; }

        /* ---------- Modais ---------- */
        .overlay-modal {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;
            background: var(--cc-scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        }
        .overlay-modal.oculto { display: none; opacity: 0; pointer-events: none; }
        .modal-box {
            position: relative; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; box-sizing: border-box;
            padding: 30px 26px 26px; text-align: center; color: var(--cc-ink);
            background: #fff; border: 3px solid var(--cc-ink); border-radius: 28px; box-shadow: 0 10px 0 var(--cc-ink);
            animation: cc-pop-in .18s var(--cc-ease-pop) both;
        }
        .btn-voltar-modal { position: absolute; top: 14px; left: 14px; width: 48px; height: 48px; }
        .modal-box h3 { margin: 6px 0 8px; font-family: var(--cc-font-title); font-size: 26px; font-weight: 700; color: var(--cc-ink); }
        .modal-box p { margin: 0 0 18px; color: var(--cc-muted); font-size: 16px; line-height: 1.45; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
        .stat-item { display: flex; flex-direction: column; gap: 4px; align-items: center; background: var(--cc-paper); border: 2px solid var(--cc-sky-line); border-radius: 16px; padding: 10px 4px; }
        .stat-label { font-size: 13px; font-weight: 700; color: var(--cc-muted); }
        .stat-valor { font-family: var(--cc-font-hud); font-size: 24px; font-weight: 700; color: var(--cc-ink); }
        .stat-vazio { color: var(--cc-off-ink); }
        .texto-gold { color: var(--cc-ink) !important; background: var(--cc-gold); border-radius: 8px; padding: 0 6px; }
        .texto-esmeralda { color: var(--cc-ok-ink) !important; }
        .modal-acoes { display: flex; gap: 12px; }
        .modal-acoes > * { flex: 1; }
        .btn-perigo { background: var(--cc-bad) !important; box-shadow: inset 0 -5px 0 var(--cc-bad-ink), 0 5px 0 var(--cc-ink) !important; }

        .btn-jogar { width: 100%; }

        /* ================= IFRAME DO MINIJOGO ================= */
        #game-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgb(255, 255, 255); z-index: 2147483647; display: none;
            justify-content: center; align-items: center;
        }
        #game-iframe { aspect-ratio: 16 / 9; width: 100%; max-height: 100vh; max-width: 177.78vh; border: none; }

        body.jogo-aberto { overflow: hidden !important; }
        body.jogo-aberto .btn-acessibilidade-audio,
        body.jogo-aberto [vw] {
            visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; z-index: -1 !important;
        }
        body.jogo-aberto .hub-proxima { display: none; }

        /* ---------- Celular ---------- */
        @media (max-width: 720px) {
            body { padding-bottom: 190px; }
            header { margin-top: 14px; gap: 10px; align-items: flex-start; }
            .hub-barra { padding: 10px 12px; gap: 10px; }
            .perfil-tipo { font-size: 21px; }
            .hub-metas { width: 100%; }
            .hub-progresso { flex: 1; width: auto; }
            .btn-icone { width: 48px; height: 48px; }
            .container-fases { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; margin-top: 30px; }
            .level-wrap::before { display: none; }
            .level-card { height: 200px; }
            .hub-proxima { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; bottom: 12px; }
        }
        @media screen and (max-height: 600px) and (orientation: landscape) {
            body { padding-bottom: 110px; }
            header { margin-top: 10px; }
            .hub-barra { min-height: 56px; }
            .container-fases { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 24px 12px; margin-top: 26px; }
            .level-wrap:nth-child(even) { padding-top: 20px; }
            .level-wrap::before { display: none; }
            .level-card { height: 160px; gap: 6px; padding-top: 18px; border-radius: 18px; }
            .level-icone { width: 44px; height: 44px; font-size: 24px; border-radius: 12px; }
            .level-title { font-size: 15px; }
            .estrela svg { width: 20px; height: 20px; }
            .hub-proxima { padding: 8px 10px 8px 18px; bottom: 10px; }
            .hub-proxima-desc { display: none; }
            .modal-box { padding: 16px 20px 18px; }
            .estrela.maior svg { width: 36px; height: 36px; }
            .estrela.maior:nth-child(2) svg { width: 46px; height: 46px; }
        }
    </style>
    <link rel="stylesheet" href="plantao.css">
</head>
<body>

    <img src="menu_inicial/images/fundo.jpg" class="bg-imagem-real" alt="Fundo">

    <header>
        <button class="btn-icone btn-voltar" onclick="voltarParaMenu()" title="Voltar ao Menu" aria-label="Voltar ao menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="hub-barra">
            <div class="perfil-wrapper">
                <span class="perfil-label">Jornada</span>
                <div class="perfil-tipo-container">
                    <span class="perfil-tipo" id="txt-perfil-header">Carregando...</span>
                </div>
                <button class="btn-trocar-perfil" onclick="alternarPerfil()">Trocar</button>
            </div>
            <div class="hub-metas">
                <div class="hub-progresso" title="Fases concluídas">
                    <div class="cc-progress" role="progressbar" aria-label="Fases concluídas" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" id="hub-barra-progresso"><div class="cc-progress__fill" id="hub-barra-fill"></div></div>
                    <span class="hub-num" id="hub-fases-num">0/0</span>
                </div>
                <span class="hub-estrelas" title="Estrelas conquistadas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC83D" stroke="#004357" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="hub-num" id="hub-estrelas-num">0/0</span><span class="sr-only">estrelas</span></span>
            </div>
        </div>
        <button class="btn-icone btn-apagar" onclick="apagarProgresso()" title="Descartar Progresso" aria-label="Descartar progresso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
    </header>

    <div class="container-fases" id="lista-fases"></div>

    <section class="hub-proxima" id="hub-proxima" hidden aria-label="Próxima fase">
        <div class="hub-proxima-txt">
            <span class="cc-label" id="hub-proxima-label">PRÓXIMA FASE</span>
            <span class="hub-proxima-nome" id="hub-proxima-nome"></span>
            <span class="hub-proxima-desc" id="hub-proxima-desc"></span>
        </div>
        <button class="cc-btn cc-btn--primary" id="hub-proxima-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Jogar</button>
    </section>

    <!-- MODAL DE DETALHES DA FASE -->
    <div id="modal-fase" class="overlay-modal oculto" onclick="fecharModalFase()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="btn-icone btn-voltar-modal" onclick="fecharModalFase()" aria-label="Fechar e voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            
            <div class="estrelas-container" id="modal-fase-estrelas" style="justify-content: center; margin-bottom: 5px; font-size: 24px;"></div>
            <h3 id="modal-fase-titulo">Fase</h3>
            <p id="modal-fase-desc">Descrição</p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Pontos</span>
                    <span class="stat-valor" id="modal-fase-pts">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo</span>
                    <span class="stat-valor" id="modal-fase-tempo">0s</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Precisão</span>
                    <span class="stat-valor" id="modal-fase-precisao">0%</span>
                </div>
            </div>

            <button class="btn-jogar cc-btn cc-btn--primary" id="btn-iniciar-fase"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Jogar fase</button>
        </div>
    </div>

    <!-- MODAL CONFIRMAR APAGAR -->
    <div id="modal-confirmacao" class="overlay-modal oculto">
        <div class="modal-box">
            <h3 style="color: var(--cc-bad-ink);">Atenção</h3>
            <p id="modal-texto-alerta"></p>
            <div class="modal-acoes">
                <button class="btn-jogar cc-btn" onclick="fecharModalConfirmacao()">Cancelar</button>
                <button class="btn-jogar cc-btn cc-btn--primary btn-perigo" onclick="confirmarApagarProgresso()">Apagar</button>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <iframe id="game-iframe" src="" allow="autoplay"></iframe>
    </div>

    <script>
        const PASTAS = {
            profissional: [
                'minijogoProf01_triagem_recepcao',
                'minijogoProf02_finalid_neces_atend',
                'minijogoProf03_revogacao_sistema',
                'minijogoProf04_direitos_portal_paciente',
                'minijogoProf05_anonimizacao_pesquisa',
                'minijogoProf06_criancas_pediatria',
                'minijogoProf07_gestao_administracao', 
                'minijogoProf08_ciberseguranca_seguranca',
                'minijogoProf09_incidente_seguranca'
            ],
            usuario_sus: [
                'minijogoUsuSus01_recepcao',
                'minijogoUsuSus02_triagem',
                'minijogoUsuSus03_consultorio', 
                'minijogoUsuSus04_exames', 
                'minijogoUsuSus05_administracao', 
                'minijogoUsuSus06_consentimento'
            ]
        };

        const METADADOS_FASES = {
            'minijogoProf01_triagem_recepcao': { titulo: 'Fase 1: Recepção', desc: 'Classificação de dados e recepção de usuários.' },
            'minijogoProf02_finalid_neces_atend': { titulo: 'Fase 2: Atendimento', desc: 'Princípios de necessidade e finalidade.' },
            'minijogoProf03_revogacao_sistema': { titulo: 'Fase 3: Sistema', desc: 'Processos de anonimização de dados.' },
            'minijogoProf04_direitos_portal_paciente': { titulo: 'Fase 4: Prontuário', desc: 'Direitos dos pacientes no prontuário eletrônico.' },
            'minijogoProf05_anonimizacao_pesquisa': { titulo: 'Fase 5: Pesquisa', desc: 'Processos de anonimização de dados na APS.' },
            'minijogoProf06_criancas_pediatria': { titulo: 'Fase 6: Pediatria', desc: 'Cuidados com dados sensíveis de menores.' },
            'minijogoProf07_gestao_administracao': { titulo: 'Fase 7: Gestão', desc: 'Boas práticas de gestão de dados.' },
            'minijogoProf08_ciberseguranca_seguranca': { titulo: 'Fase 8: Auditoria', desc: 'Auditoria e defesa do Banco de Dados.' },
            'minijogoProf09_incidente_seguranca': { titulo: 'Fase 9: Incidentes', desc: 'Tratamento de incidentes de segurança.' },

            'minijogoUsuSus01_recepcao': { titulo: 'Fase 1: Recepção', desc: 'Identifique quais dados exigem mais proteção ao chegar na UBS.' },
            'minijogoUsuSus02_triagem': { titulo: 'Fase 2: Triagem', desc: 'Saiba separar seus dados pessoais dos dados sensíveis de saúde.' },
            'minijogoUsuSus03_consultorio': { titulo: 'Fase 3: Consultório', desc: 'Entenda como sua identidade é protegida em pesquisas.' },
            'minijogoUsuSus04_exames': { titulo: 'Fase 4: Exames', desc: 'Identifique formas seguras de compartilhar seus resultados.' },
            'minijogoUsuSus05_administracao': { titulo: 'Fase 5: Privacidade', desc: 'Descubra e exerça os seus direitos como titular dos dados.' },
            'minijogoUsuSus06_consentimento': { titulo: 'Fase 6: Consentimento', desc: 'Aprenda em quais situações o seu consentimento é obrigatório.' }
        };

        const SAVE_KEY = 'lgpd_game_save_v2';
        let perfilAtual = 'profissional';
        let modoDev = false;
        let progresso = {};
        let faseAtivaPasta = null;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('perfil')) perfilAtual = urlParams.get('perfil');
            else {
                // Recupera da memória se tiver
                const salvo = localStorage.getItem('lgpd_ultimo_perfil');
                if (salvo) perfilAtual = salvo;
            }
            if (urlParams.has('dev')) modoDev = urlParams.get('dev') === 'true';

            atualizarTituloPerfil();
            carregarProgresso();
            renderizarFases();
        };

        function atualizarTituloPerfil() {
            document.getElementById('txt-perfil-header').innerText = perfilAtual === 'profissional' ? "Profissional" : "Usuário do SUS";
            localStorage.setItem('lgpd_ultimo_perfil', perfilAtual);
        }

        function alternarPerfil() {
            perfilAtual = perfilAtual === 'profissional' ? 'usuario_sus' : 'profissional';
            atualizarTituloPerfil();
            renderizarFases();
        }

        function carregarProgresso() {
            const save = localStorage.getItem(SAVE_KEY);
            progresso = save ? JSON.parse(save) : {};
        }
        function salvarProgresso() { localStorage.setItem(SAVE_KEY, JSON.stringify(progresso)); }

        function apagarProgresso() {
            const nomePerfil = perfilAtual === 'profissional' ? "Profissional" : "Usuário do SUS";
            document.getElementById('modal-texto-alerta').innerHTML = `Tem certeza de que deseja apagar o progresso do perfil <strong>${nomePerfil}</strong>?`;
            document.getElementById('modal-confirmacao').classList.remove('oculto');
        }
        function fecharModalConfirmacao() { document.getElementById('modal-confirmacao').classList.add('oculto'); }
        function confirmarApagarProgresso() {
            const pastasDoPerfil = PASTAS[perfilAtual] || [];
            pastasDoPerfil.forEach(nomePasta => { if (progresso[nomePasta]) delete progresso[nomePasta]; });
            salvarProgresso(); renderizarFases(); fecharModalConfirmacao(); 
        }

        // ================= PLANTÃO: ícones e resumo do hub (só exibição) =================
        const SVG_ESTRELA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" stroke-width="1.8" stroke-linejoin="round"/></svg>';

        function atualizarResumoHub(concluidas, total, estrelas, proxima) {
            const barra = document.getElementById('hub-barra-progresso');
            const fill = document.getElementById('hub-barra-fill');
            if (barra && fill) {
                fill.style.width = total ? `${Math.round(concluidas / total * 100)}%` : '0%';
                barra.setAttribute('aria-valuemax', total);
                barra.setAttribute('aria-valuenow', concluidas);
            }
            const nFases = document.getElementById('hub-fases-num');
            if (nFases) nFases.innerText = `${concluidas}/${total}`;
            const nEstrelas = document.getElementById('hub-estrelas-num');
            if (nEstrelas) nEstrelas.innerText = `${estrelas}/${total * 3}`;

            const painel = document.getElementById('hub-proxima');
            if (!painel) return;
            if (!proxima) { painel.hidden = true; return; }
            painel.hidden = false;
            document.getElementById('hub-proxima-label').innerText = `PRÓXIMA FASE · ${String(proxima.numeroFase).padStart(2, '0')}`;
            document.getElementById('hub-proxima-nome').innerText = proxima.metadado.titulo.replace(/Fase \d+: /, '');
            document.getElementById('hub-proxima-desc').innerText = proxima.metadado.desc;
            document.getElementById('hub-proxima-btn').onclick = () => proxima.card.click();
        }

        function renderizarFases() {
            const lista = document.getElementById('lista-fases');
            lista.innerHTML = ''; 
            const pastasDoPerfil = PASTAS[perfilAtual] || [];

            // Contadores de Conquista da Jornada
            let fasesConcluidas = 0;
            let estrelasObtidas = 0;
            const totalFases = pastasDoPerfil.length;
            let proximaFase = null;

            pastasDoPerfil.forEach((nomePasta, index) => {
                const metadado = METADADOS_FASES[nomePasta] || { titulo: `Fase ${index + 1}`, desc: '...' };
                const numeroFase = index + 1;
                
                let liberada = false;
                if (modoDev || index === 0) liberada = true;
                else {
                    const pastaAnterior = pastasDoPerfil[index - 1];
                    if (progresso[pastaAnterior] && progresso[pastaAnterior].concluida) liberada = true;
                }

                const dados = progresso[nomePasta] || { concluida: false, pontuacaoMax: 0, melhorTempo: 0, melhorPrecisao: 0 };

                let classesEstado = !liberada ? 'bloqueada' : (dados.concluida ? 'concluida' : 'destaque-atual');

                // let numEstrelas = 0;
                // if (dados.concluida) {
                //     if (dados.melhorPrecisao === 100) numEstrelas = 3;
                //     else if (dados.melhorPrecisao >= 85) numEstrelas = 2;
                //     else numEstrelas = 1;
                // }
                let numEstrelas = 0;
                let classeEstrela = 'ativa';

                if (dados.concluida) {
                    fasesConcluidas++; // Registra que a fase foi vencida

                    // NOVA LÓGICA: Precisão + Tempo Restante
                    if (dados.melhorPrecisao === 100) {
                        // Acertou tudo e sobrou mais de 30 segundos = 3 Estrelas (Perfeição ágil)
                        if (dados.melhorTempo >= 30) numEstrelas = 3;
                        // Acertou tudo, mas foi devagar = 2 Estrelas
                        else numEstrelas = 2; 
                    } else if (dados.melhorPrecisao >= 80) {
                        // Errou 1 item (ex: 83%), mas foi rápido (sobrou mais de 30s) = 2 Estrelas
                        if (dados.melhorTempo >= 30) numEstrelas = 2;
                        // Errou 1 item e foi devagar = 1 Estrela
                        else numEstrelas = 1; 
                    } else {
                        // Passou na risca da meta (ex: 75%), mas foi rápido (sobrou mais de 30s) = 1 Estrela
                        if (dados.melhorTempo >= 30) numEstrelas = 1;
                        // Passou na risca da meta (ex: 75%) e foi devagar = 0 Estrela
                        else numEstrelas = 0;
                    }

                    // if (numEstrelas < 3) {
                    //     classeEstrela = 'ativa-clara';
                    // }
                    estrelasObtidas += numEstrelas; // Soma as estrelas para o placar final
                }

                // classesEstado = !liberada ? 'bloqueada' : (dados.concluida ? (numEstrelas === 3 ? 'mestre' : 'concluida') : 'destaque-atual');

                const card = document.createElement('div');
                card.className = `level-card ${classesEstado}`;
                const tituloCurto = metadado.titulo.replace(/Fase \d+: /, ''); 
                const STATUS = { concluida: 'Concluída', 'destaque-atual': 'Jogue agora', bloqueada: 'Bloqueada' };
                const ICONE_CADEADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

                card.innerHTML = `
                    <div class="level-number">${String(numeroFase).padStart(2, '0')}</div>
                    <div class="level-icone" aria-hidden="true">${liberada ? tituloCurto.charAt(0) : ICONE_CADEADO}</div>
                    <div class="level-title">${tituloCurto}</div>
                    <div class="estrelas-container" role="img" aria-label="${numEstrelas} de 3 estrelas">
                        <span class="estrela ${numEstrelas >= 1 ? classeEstrela : ''}">${SVG_ESTRELA}</span>
                        <span class="estrela ${numEstrelas >= 2 ? classeEstrela : ''}">${SVG_ESTRELA}</span>
                        <span class="estrela ${numEstrelas >= 3 ? classeEstrela : ''}">${SVG_ESTRELA}</span>
                    </div>
                `;

                const wrap = document.createElement('div');
                wrap.className = `level-wrap ${classesEstado}`;
                wrap.appendChild(card);
                const tag = document.createElement('span');
                tag.className = 'level-tag';
                tag.innerText = STATUS[classesEstado];
                wrap.appendChild(tag);

                if (liberada) {
                    card.onclick = () => abrirModalFase(nomePasta, metadado, dados, numEstrelas);
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', `${metadado.titulo}. ${STATUS[classesEstado]}. ${numEstrelas} de 3 estrelas.`);
                    card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } };
                    if (classesEstado === 'destaque-atual' && !proximaFase) proximaFase = { card, metadado, numeroFase };
                } else {
                    card.setAttribute('aria-label', `${metadado.titulo}. Bloqueada.`);
                }
                lista.appendChild(wrap);
            });

            atualizarResumoHub(fasesConcluidas, totalFases, estrelasObtidas, proximaFase);

            // ================= LÓGICA DE DESTAQUE GERAL (HEADER E TELA) =================
            const header = document.querySelector('header');
            const labelHeader = document.querySelector('.perfil-label');

            // Limpa os estados anteriores (Header e Body)
            header.classList.remove('perfil-concluido', 'perfil-mestre');
            document.body.classList.remove('vitoria-verde', 'vitoria-ouro');

            if (fasesConcluidas === totalFases) {
                // Checa se o jogador pegou o máximo possível de estrelas (3 x Número de Fases)
                if (estrelasObtidas === (totalFases * 3)) {
                    header.classList.add('perfil-mestre');
                    labelHeader.innerText = "Especialista de Ouro";
                    document.body.classList.add('vitoria-ouro');
                    // ==========================================
                    // NOVO: Pinta todos os cartões de dourado!
                    // Busca todos os cartões gerados e adiciona a classe 'mestre'
                    // ==========================================
                    document.querySelectorAll('.level-card').forEach(card => {
                        card.classList.add('mestre');
                    });
                } else {
                    header.classList.add('perfil-concluido');
                    labelHeader.innerText = "Jornada Concluída";
                    document.body.classList.add('vitoria-verde');
                }
            } else {
                // Estado normal se ainda faltarem fases
                labelHeader.innerText = "Jornada";
            }
        }

        function abrirModalFase(nomePasta, metadado, dados, numEstrelas) {
            // Ícone gamificado para substituir os "--"
            const iconeVazio = '<span class="stat-vazio" aria-label="Sem registro">--</span>';
            const iconeMaisTempo = '<span class="stat-vazio" title="Concluída com tempo extra (sem recorde)" aria-label="Concluída com tempo extra">+T</span>';

            document.getElementById('modal-fase-titulo').innerText = metadado.titulo;
            document.getElementById('modal-fase-desc').innerText = metadado.desc;
            document.getElementById('modal-fase-pts').innerHTML = dados.concluida ? (dados.melhorTempo == 0 ? iconeMaisTempo : dados.pontuacaoMax) : iconeVazio;
            document.getElementById('modal-fase-tempo').innerHTML = dados.concluida ? (dados.melhorTempo == 0 ? iconeMaisTempo : dados.melhorTempo + 's') : iconeVazio;
            document.getElementById('modal-fase-precisao').innerHTML = dados.melhorPrecisao !== undefined && dados.concluida ? (dados.melhorTempo == 0 ? iconeMaisTempo : dados.melhorPrecisao + '%') : iconeVazio;

            const modalPts = document.getElementById('modal-fase-pts');
            const modalTempo = document.getElementById('modal-fase-tempo');
            const modalPrecisao = document.getElementById('modal-fase-precisao');

            // Limpa as cores (volta para o azul padrão) antes de reavaliar
            modalPts.className = 'stat-valor';
            modalTempo.className = 'stat-valor';
            modalPrecisao.className = 'stat-valor';

            // Aplica as cores Golden dependendo do desempenho
            if (dados.concluida) {
                // Tempo >= 30s fica Dourado
                if (dados.melhorTempo >= 30) {
                    modalTempo.classList.add('texto-gold');
                }

                // Precisão = 100% (Dourado) ou >= 80% (Dourado Claro)
                if (dados.melhorPrecisao === 100) {
                    modalPrecisao.classList.add('texto-gold'); // Pinta a precisão de Dourado
                    modalPts.classList.add('texto-gold'); // Pinta a pontuação de Dourado também
                } else if (dados.melhorPrecisao >= 80) {
                    modalPrecisao.classList.add('texto-esmeralda'); // Pinta a precisão de Verde Esmeralda
                    modalPts.classList.add('texto-esmeralda'); // Pinta a pontuação de Verde Esmeralda também
                }
            }

            document.getElementById('modal-fase-estrelas').innerHTML = `
                <span class="estrela maior ${numEstrelas >= 1 ? 'ativa' : ''}">${SVG_ESTRELA}</span>
                <span class="estrela maior ${numEstrelas >= 2 ? 'ativa' : ''}">${SVG_ESTRELA}</span>
                <span class="estrela maior ${numEstrelas >= 3 ? 'ativa' : ''}">${SVG_ESTRELA}</span>
            `;
            document.getElementById('modal-fase-estrelas').setAttribute('aria-label', `${numEstrelas} de 3 estrelas`);

            document.getElementById('btn-iniciar-fase').onclick = () => {
                fecharModalFase();
                abrirMinijogo(nomePasta);
            };
            document.getElementById('modal-fase').classList.remove('oculto');
        }

        function fecharModalFase() { document.getElementById('modal-fase').classList.add('oculto'); }

        function abrirMinijogo(nomePasta) {
            faseAtivaPasta = nomePasta;
            const wrapper = document.getElementById('game-wrapper');
            const iframe = document.getElementById('game-iframe');
            document.body.classList.add('jogo-aberto');

            iframe.addEventListener('load', () => {
                const tentarAcordarAudio = () => {
                    try {
                        const iframeWin = iframe.contentWindow;
                        if (iframeWin.AudioSys && iframeWin.AudioSys.ctx && iframeWin.AudioSys.ctx.state === 'suspended') {
                            iframeWin.AudioSys.ctx.resume();
                        }
                    } catch (e) {}
                };
                document.body.addEventListener('click', tentarAcordarAudio, { capture: true, once: true });
                document.body.addEventListener('touchstart', tentarAcordarAudio, { capture: true, once: true });
            }, { once: true });

            iframe.src = nomePasta + '/index.html'; 
            wrapper.style.display = 'flex';
        }

        function fecharMinijogo() {
            document.getElementById('game-wrapper').style.display = 'none';
            document.getElementById('game-iframe').src = ""; 
            faseAtivaPasta = null;
            document.body.classList.remove('jogo-aberto');
        }

        window.AvisarVitoria = function(engineObj) {
            if (faseAtivaPasta) {
                if (!progresso[faseAtivaPasta]) progresso[faseAtivaPasta] = { concluida: false, pontuacaoMax: 0, melhorTempo: 0, melhorPrecisao: 0 };
                progresso[faseAtivaPasta].concluida = true;
                
                if (engineObj) {
                    const pts = engineObj.pontuacao !== undefined ? engineObj.pontuacao : (engineObj.acertosTotais || 0);
                    const tempo = engineObj.tempoRestante || 0;
                    const acertos = engineObj.acertos || engineObj.acertosTotais || 0;
                    const erros = engineObj.erros || engineObj.errosTotais || 0;
                    let precisao = engineObj.precisao !== undefined ? engineObj.precisao : ((acertos + erros) > 0 ? Math.round((acertos / (acertos + erros)) * 100) : 100);
                    
                    if (pts > progresso[faseAtivaPasta].pontuacaoMax) progresso[faseAtivaPasta].pontuacaoMax = pts;
                    if (tempo > progresso[faseAtivaPasta].melhorTempo) progresso[faseAtivaPasta].melhorTempo = tempo;
                    if (precisao > (progresso[faseAtivaPasta].melhorPrecisao || 0)) progresso[faseAtivaPasta].melhorPrecisao = precisao;
                }
                salvarProgresso();
            }
            fecharMinijogo(); renderizarFases(); 
        };

        window.AvisarCancelamento = function() { fecharMinijogo(); };
        function voltarParaMenu() { window.location.href = `menu_inicial/index.html?modo2d=true&dev=${modoDev}`; }
        
    </script>
    <script src="acessibilidade.js"></script>
</body>
